name: Release mod and installers

# Publish one complete release after the ZIP and both installers are ready.
# Without signing credentials the EXE is explicitly labelled unsigned.
# A configured signing failure never downgrades to an unsigned publication.
#
# Required repo/org secrets once the SignPath application is approved:
#   SIGNPATH_API_TOKEN         CI user token from the SignPath organization
# Required repo variables:
#   SIGNPATH_ORGANIZATION_ID   from the SignPath org page
#
# SignPath project setup (one-time, in the SignPath web UI):
#   project slug:        noitamap-mod
#   artifact config:     single unsigned EXE (installer), deep-sign
#   signing policies:    test-signing (self-service), release-signing (approved)
# The trusted-build link back to this workflow is what lets the Foundation
# verify the artifact came from this repository — do not build the EXE in a
# different workflow and pass it in.

on:
  push:
    tags: ["*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  portable:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Install LuaJIT
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y luajit
      - name: Validate release source and package
        run: |
          luajit tests/runtime.lua
          python3 -m unittest discover -s tests -p '*_test.py' -v
          python3 build_release.py
      - name: Save portable package
        uses: actions/upload-artifact@v7
        with:
          name: noitamap-zip
          path: |
            dist/noitamap.zip
            dist/install.sh
            dist/SHA256SUMS.txt
          if-no-files-found: error
          overwrite: true

  build:
    needs: portable
    runs-on: windows-latest
    env:
      # The `secrets` context is NOT available in step-level `if:` conditions,
      # so hoist the "is signing configured yet?" test into an env var here,
      # where secrets ARE allowed. Before SignPath approves the project this is
      # 'false' and the workflow publishes an explicitly unsigned installer.
      HAS_SIGNPATH: ${{ secrets.SIGNPATH_API_TOKEN != '' }}
    outputs:
      version: ${{ steps.ver.outputs.version }}
      signed: ${{ steps.package.outputs.signed }}
    steps:
      - uses: actions/checkout@v4

      - name: Resolve version from tag
        id: ver
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then v="${GITHUB_REF#refs/tags/}"; v="${v#v}"; else v="0.0.0-ci$GITHUB_RUN_NUMBER"; fi
          if [[ ! "$v" =~ ^[0-9]+(\.[0-9]+){1,3}(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::Use a version tag such as 4.4.1"
            exit 1
          fi
          echo "version=$v" >> "$GITHUB_OUTPUT"

      - name: Build installer (Inno Setup)
        shell: pwsh
        env:
          APP_VERSION: ${{ steps.ver.outputs.version }}
        # Don't hardcode a version/bitness path: Inno ships as "Inno Setup 6"
        # under Program Files (x86) on the current runner image, but 7 installs
        # to Program Files, and the runner image can change under us. Resolve
        # ISCC, and install it if the image doesn't carry it at all.
        run: |
          $iscc = @(
            "${env:ProgramFiles}\Inno Setup 7\ISCC.exe",
            "${env:ProgramFiles(x86)}\Inno Setup 7\ISCC.exe",
            "${env:ProgramFiles}\Inno Setup 6\ISCC.exe",
            "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          ) | Where-Object { Test-Path $_ } | Select-Object -First 1

          if (-not $iscc) {
            $iscc = (Get-Command iscc.exe -ErrorAction SilentlyContinue).Source
          }
          if (-not $iscc) {
            Write-Host "Inno Setup not found on the image; installing via winget."
            winget install --id JRSoftware.InnoSetup --silent --accept-package-agreements --accept-source-agreements
            $iscc = @(
              "${env:ProgramFiles}\Inno Setup 7\ISCC.exe",
              "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
            ) | Where-Object { Test-Path $_ } | Select-Object -First 1
          }
          if (-not $iscc) { throw "Could not locate ISCC.exe" }

          Write-Host "Using $iscc"
          & $iscc installer\noitamap-mod.iss "/DAppVer=$env:APP_VERSION"
          if ($LASTEXITCODE -ne 0) { throw "ISCC failed with exit code $LASTEXITCODE" }

      - name: Upload unsigned installer (input to signing)
        id: upload-unsigned
        uses: actions/upload-artifact@v4
        with:
          name: installer-unsigned
          path: installer/out/noitamap-mod-installer-${{ steps.ver.outputs.version }}.exe
          if-no-files-found: error
          overwrite: true

      - name: Submit to SignPath and wait for the signed artifact
        # Skipped until the SignPath application is approved and the token is
        # configured. The unsigned path is explicit; a configured signing
        # failure stops the build and prevents release publication.
        if: env.HAS_SIGNPATH == 'true'
        uses: signpath/github-action-submit-signing-request@v1.2
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: noitamap-mod
          # Tag builds go through the approved release policy; manual runs use
          # test-signing (a Foundation requirement: release signing must be
          # gated on maintainer approval).
          signing-policy-slug: ${{ startsWith(github.ref, 'refs/tags/') && 'release-signing' || 'test-signing' }}
          github-artifact-id: ${{ steps.upload-unsigned.outputs.artifact-id }}
          wait-for-completion: true
          output-artifact-directory: signed

      - name: Prepare Windows release asset
        id: package
        shell: pwsh
        env:
          APP_VERSION: ${{ steps.ver.outputs.version }}
        run: |
          New-Item -ItemType Directory -Force release | Out-Null
          if ($env:HAS_SIGNPATH -eq 'true') {
            $files = @(Get-ChildItem signed -Filter *.exe -Recurse)
            if ($files.Count -ne 1) { throw 'Expected exactly one signed installer' }
            $source = $files[0].FullName
            $kind = 'signed'
          } else {
            $source = "installer/out/noitamap-mod-installer-$env:APP_VERSION.exe"
            $kind = 'unsigned'
          }
          $name = "noitamap-mod-installer-$env:APP_VERSION-$kind.exe"
          Copy-Item -LiteralPath $source -Destination "release/$name"
          $hash = (Get-FileHash "release/$name" -Algorithm SHA256).Hash.ToLowerInvariant()
          [IO.File]::WriteAllText("$PWD/release/SHA256SUMS-windows.txt", "$hash  $name`n", [Text.UTF8Encoding]::new($false))
          "signed=$env:HAS_SIGNPATH" >> $env:GITHUB_OUTPUT

      - name: Save Windows release asset
        uses: actions/upload-artifact@v7
        with:
          name: windows-release
          overwrite: true
          if-no-files-found: error
          path: |
            release/*.exe
            release/SHA256SUMS-windows.txt

  publish:
    name: Publish complete release
    needs: [portable, build]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: noitamap-zip
          path: release
      - uses: actions/download-artifact@v8
        with:
          name: windows-release
          path: release
      - name: Verify assets and prepare release notes
        working-directory: release
        env:
          INSTALLER_SIGNED: ${{ needs.build.outputs.signed }}
        run: |
          sha256sum -c SHA256SUMS.txt
          sha256sum -c SHA256SUMS-windows.txt
          cat SHA256SUMS-windows.txt >> SHA256SUMS.txt
          cat > RELEASE.txt <<'NOTES'
          - **Windows:** download and run the `.exe` installer.
          - **Manual installation:** extract `noitamap.zip` into Noita's `mods` folder. The resulting path must be `mods/noitamap/mod.xml`.
          - **Linux / Steam Deck:** download `install.sh` and run `sh install.sh`. It includes the mod; no separate ZIP is needed.

          Enable **Noita Map** and **Unsafe mods** in Noita, then press **M** during a run.
          NOTES
          if [ "$INSTALLER_SIGNED" = true ]; then
            echo 'The Windows installer is signed.' >> RELEASE.txt
          else
            echo 'The Windows installer is unsigned and is labelled `-unsigned.exe`.' >> RELEASE.txt
          fi
      - name: Publish all installable assets
        id: release
        uses: softprops/action-gh-release@v2
        with:
          body_path: release/RELEASE.txt
          fail_on_unmatched_files: true
          files: |
            release/noitamap.zip
            release/install.sh
            release/*.exe
            release/SHA256SUMS.txt
      - name: Release verdict
        env:
          RELEASE_URL: ${{ steps.release.outputs.url }}
          INSTALLER_SIGNED: ${{ needs.build.outputs.signed }}
        run: |
          if [ "$INSTALLER_SIGNED" = true ]; then kind=signed; else kind=unsigned; fi
          verdict="RELEASE: PUBLISHED — mod ZIP, standalone Linux installer and $kind Windows installer."
          echo "$verdict"
          echo "**$verdict**" >> "$GITHUB_STEP_SUMMARY"
          echo "[Download release]($RELEASE_URL)" >> "$GITHUB_STEP_SUMMARY"
